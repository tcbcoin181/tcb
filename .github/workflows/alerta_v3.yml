name: ALERTA V3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alerta-v3-tcb
  cancel-in-progress: false

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests numpy

      - name: Run Alerta V3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SECRETOS_JSON: ${{ secrets.SECRETOS_JSON }}
        run: python -u alerta_v3.py

      - name: Commit state files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          CHANGES=0
          
          if [ -f btc_state.json ]; then
            git add btc_state.json
            CHANGES=1
          fi
          
          if [ -f alertas_state.json ]; then
            git add alertas_state.json
            CHANGES=1
          fi
          
          if [ $CHANGES -eq 1 ]; then
            if ! git diff --cached --quiet; then
              git commit -m "update state [skip ci]"
              git pull --rebase origin main || true
              git push || true
            fi
          fi
